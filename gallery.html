    <!-- LIGHTBOX -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true, offset: 60 });

        const soundToggle = document.getElementById('soundToggle');
        const safetyAudio = document.getElementById('safetyAudio');
        const soundIcon = soundToggle.querySelector('i');

        soundToggle.addEventListener('click', () => {
            if (safetyAudio.paused) {
                safetyAudio.play();
            } else {
                safetyAudio.pause();
            }
        });

        safetyAudio.addEventListener('play', () => {
            soundToggle.classList.add('playing');
            soundToggle.setAttribute('aria-pressed', 'true');
            soundToggle.setAttribute('aria-label', 'Pause safety song');
            soundIcon.className = 'bi bi-volume-mute-fill';
        });

        safetyAudio.addEventListener('pause', () => {
            soundToggle.classList.remove('playing');
            soundToggle.setAttribute('aria-pressed', 'false');
            soundToggle.setAttribute('aria-label', 'Play safety song');
            soundIcon.className = 'bi bi-volume-up-fill';
        });

        // ── LIGHTBOX ──────────────────────────────────
        const galleryItems = Array.from(document.querySelectorAll('.gallery-item'));
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxCaption = document.getElementById('lightboxCaption');
        let currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            lightbox.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function updateLightbox() {
            const item = galleryItems[currentIndex];
            const img = item.querySelector('img');
            lightboxImg.src = img.src;
            lightboxImg.alt = img.alt;
            lightboxCaption.textContent = item.dataset.caption || '';
        }

        function closeLightbox() {
            lightbox.classList.remove('open');
            document.body.style.overflow = '';
        }

        function showNext() {
            currentIndex = (currentIndex + 1) % galleryItems.length;
            updateLightbox();
        }

        function showPrev() {
            currentIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length;
            updateLightbox();
        }

        galleryItems.forEach((item, index) => {
            item.addEventListener('click', () => openLightbox(index));
        });

        document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
        document.getElementById('lightboxNext').addEventListener('click', showNext);
        document.getElementById('lightboxPrev').addEventListener('click', showPrev);

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('open')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') showNext();
            if (e.key === 'ArrowLeft') showPrev();
        });
    </script>
